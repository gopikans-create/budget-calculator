<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - BudgetFlow</title>


<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;

        background:
            radial-gradient(circle at top left, #3730a3, transparent 35%),
            radial-gradient(circle at bottom right, #581c87, transparent 40%),
            #0f172a;

        color: white;
    }

    .register-card {
        width: 100%;
        max-width: 450px;
        padding: 35px;

        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;

        backdrop-filter: blur(20px);

        box-shadow:
            0 25px 60px rgba(0, 0, 0, 0.4);
    }

    .logo {
        width: 58px;
        height: 58px;

        margin: 0 auto 18px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 17px;

        font-size: 27px;
        font-weight: bold;

        background: linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

        box-shadow:
            0 10px 30px rgba(99, 102, 241, 0.4);
    }

    h1 {
        text-align: center;
        font-size: 29px;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 28px;
    }

    .input-group {
        margin-bottom: 17px;
    }

    label {
        display: block;
        color: #cbd5e1;
        font-size: 13px;
        margin-bottom: 7px;
    }

    input {
        width: 100%;
        padding: 13px 15px;

        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 11px;

        outline: none;

        background: rgba(15, 23, 42, 0.6);
        color: white;

        font-size: 14px;

        transition: 0.3s;
    }

    input::placeholder {
        color: #64748b;
    }

    input:focus {
        border-color: #818cf8;

        box-shadow:
            0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .register-btn {
        width: 100%;
        padding: 14px;

        margin-top: 5px;

        border: none;
        border-radius: 11px;

        background: linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

        color: white;

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }

    .register-btn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 10px 25px rgba(99, 102, 241, 0.35);
    }

    #message {
        text-align: center;
        font-size: 14px;
        margin-top: 15px;
    }

    .bottom-text {
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
        margin-top: 23px;
    }

    a {
        color: #a5b4fc;
        text-decoration: none;
        font-weight: bold;
    }

    a:hover {
        text-decoration: underline;
    }

    @media (max-width: 500px) {

        .register-card {
            padding: 28px 22px;
        }

        h1 {
            font-size: 25px;
        }
    }
</style>


</head>

<body>


<div class="register-card">

    <div class="logo">₹</div>

    <h1>Create your account</h1>

    <p class="subtitle">
        Start managing your money smarter
    </p>


    <div class="input-group">

        <label>Full Name</label>

        <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
        >

    </div>


    <div class="input-group">

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Choose a username"
        >

    </div>


    <div class="input-group">

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

    </div>


    <div class="input-group">

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create a password"
        >

    </div>


    <div class="input-group">

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
        >

    </div>


    <button class="register-btn" onclick="register()">
        Create Account
    </button>


    <p id="message"></p>


    <p class="bottom-text">

        Already have an account?

        <a href="login.html">
            Sign in
        </a>

    </p>

</div>


<script>

    function register() {

        let fullName =
            document.getElementById("fullName").value.trim();

        let username =
            document.getElementById("username").value.trim();

        let email =
            document.getElementById("email").value.trim();

        let password =
            document.getElementById("password").value;

        let confirmPassword =
            document.getElementById("confirmPassword").value;

        let message =
            document.getElementById("message");


        // Check empty fields

        if (
            fullName == "" ||
            username == "" ||
            email == "" ||
            password == "" ||
            confirmPassword == ""
        ) {

            message.innerHTML =
                "Please fill all fields";

            message.style.color = "#f87171";

            return;
        }


        // Check password

        if (password != confirmPassword) {

            message.innerHTML =
                "Passwords do not match";

            message.style.color = "#f87171";

            return;
        }


        // Check existing user

        let existingUser =
            localStorage.getItem("user");


        if (existingUser != null) {

            let user =
                JSON.parse(existingUser);


            if (user.username == username) {

                message.innerHTML =
                    "Username already exists";

                message.style.color = "#f87171";

                return;
            }


            if (user.email == email) {

                message.innerHTML =
                    "Email already registered";

                message.style.color = "#f87171";

                return;
            }
        }


        // Create user object

        let user = {

            fullName: fullName,

            username: username,

            email: email,

            password: password

        };


        // Store user

        localStorage.setItem(
            "user",
            JSON.stringify(user)
        );


        message.innerHTML =
            "✓ Account created successfully!";

        message.style.color = "#4ade80";


        // Clear inputs

        document.getElementById("fullName").value = "";

        document.getElementById("username").value = "";

        document.getElementById("email").value = "";

        document.getElementById("password").value = "";

        document.getElementById("confirmPassword").value = "";


        // Go to login after short delay

        setTimeout(function() {

            window.location.href = "login.html";

        }, 1200);

    }

</script>


</body>
</html>
